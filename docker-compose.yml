services:
  sre_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre_agent
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      # Persist the ChromaDB vector database
      - ./data/chroma:/app/data/chroma
      # CRITICAL: Grant the agent permission to execute Docker commands on the host
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Map host.docker.internal to the host machine's IP
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dummy_prod_api:
    build:
      context: ./target_service
      dockerfile: Dockerfile
    container_name: dummy_prod_api
    ports:
      - "8080:8080"
    restart: unless-stopped